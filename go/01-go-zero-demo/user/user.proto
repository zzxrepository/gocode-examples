syntax = "proto3";

package user;

option go_package = "github.com/zzxrepository/gocode-examples/go/01-go-zero-demo/user/pb;userpb";

service User {
  rpc Register(RegisterRequest) returns (UserReply);
  rpc Login(LoginRequest) returns (TokenReply);
  rpc ValidateToken(TokenRequest) returns (UserReply);
}

message RegisterRequest { string email = 1; string password = 2; }
message LoginRequest { string email = 1; string password = 2; }
message TokenRequest { string token = 1; }
message UserReply { int64 user_id = 1; string email = 2; }
message TokenReply { string token = 1; int64 user_id = 2; }
