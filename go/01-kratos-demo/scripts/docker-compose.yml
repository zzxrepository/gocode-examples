services:
  mysql:
    image: mysql:8.4
    container_name: blog-demo-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: blog_demo
      MYSQL_USER: blog
      MYSQL_PASSWORD: blog123
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - blog_demo_mysql:/var/lib/mysql
      - ../user-service/migrations/001_users.sql:/docker-entrypoint-initdb.d/001_users.sql:ro
      - ../post-service/migrations/001_posts.sql:/docker-entrypoint-initdb.d/002_posts.sql:ro
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci

  redis:
    image: redis:7.2
    container_name: blog-demo-redis
    ports:
      - "6379:6379"
    volumes:
      - blog_demo_redis:/data

volumes:
  blog_demo_mysql:
  blog_demo_redis:
