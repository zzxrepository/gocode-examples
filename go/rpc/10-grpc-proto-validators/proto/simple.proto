// proto validators 示例。
// 这个文件不只定义消息，还通过 validator.field 给字段加校验规则。
syntax = "proto3";

package proto;

// validator.proto 来自 github.com/mwitkow/go-proto-validators。
// protoc-gen-govalidators 会读取这些 option，并生成 Validate() 方法。
import "validator.proto";

option go_package = "go-grpc-proto-validators/proto;proto";

// InnerMessage 是请求类型。
message InnerMessage {
  // some_integer 必须大于 0 且小于 100。
  int32 some_integer = 1 [(validator.field) = {int_gt: 0, int_lt: 100}];

  // some_float 必须大于等于 0 且小于等于 1。
  double some_float = 2 [(validator.field) = {float_gte: 0, float_lte: 1}];
}

// OuterMessage 是响应类型，也演示了响应结构里同样可以声明校验规则。
message OuterMessage {
  // important_string 必须匹配正则：2 到 5 个小写字母。
  string important_string = 1 [(validator.field) = {regex: "^[a-z]{2,5}$"}];

  // msg_exists 表示 inner 这个嵌套消息必须存在。
  InnerMessage inner = 2 [(validator.field) = {msg_exists: true}];
}

service Simple {
  // 服务端拦截器会在业务方法执行前调用 InnerMessage.Validate()。
  rpc Route(InnerMessage) returns (OuterMessage) {}
}
