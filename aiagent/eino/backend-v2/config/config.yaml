server:
  address: ":8081"
  cors_origins:
    - "http://localhost:5173"

models:
  default: "dashscope/qwen3.8-max"
  providers:
    - id: "dashscope"
      # 百炼当前配置使用 Anthropic 兼容接口；Eino Claude ChatModel 可直接接入。
      type: "anthropic"
      base_url: "https://your-dashscope-endpoint/apps/anthropic"
      api_token: ""
      timeout_seconds: 90
      temperature: 0.7
      max_tokens: 4096
      system_prompt: "你是一个可靠、简洁的 AI 助手。"
      models:
        - id: "qwen3.8-max"
          label: "Qwen 3.8 Max"
        - id: "qwen3.8-max[1M]"
          label: "Qwen 3.8 Max (1M)"
        - id: "qwen3.6-flash"
          label: "Qwen 3.6 Flash"

    # 新厂商的示例：取消注释并将 Token 放入 config/local.yaml。
