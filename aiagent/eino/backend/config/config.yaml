server:
  address: ":8080"
  # 开发时允许 Vite 前端访问；生产环境请改为实际站点域名。
  cors_origins:
    - "http://localhost:5173"

models:
  # 模型引用采用 provider_id/model_id；前端只能请求本列表中已登记的模型。
  default: "dashscope/qwen3.8-max"
  providers:
    - id: "dashscope"
      # anthropic：百炼 Anthropic 兼容接口；openai：Chat Completions 接口。
      type: "anthropic"
      base_url: "https://your-dashscope-endpoint/apps/anthropic"
      # 不要提交真实令牌；请在 config/local.yaml 或环境变量中填写。
      api_token: ""
      timeout_seconds: 90
      temperature: 0.7
      max_tokens: 4096
      system_prompt: "你是一个可靠、简洁的 AI 助手。使用用户提问的语言回答。"
      models:
        - id: "qwen3.8-max"
          label: "Qwen 3.8 Max"
        - id: "qwen3.8-max[1M]"
          label: "Qwen 3.8 Max · 1M Context"
        - id: "qwen3.6-flash"
          label: "Qwen 3.6 Flash"
